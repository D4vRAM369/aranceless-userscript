<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="AranceLess: ¿3 € por artículo? No, gracias">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001f66"/><stop offset="1" stop-color="#003399"/>
    </linearGradient>
    <symbol id="star" viewBox="-1 -1 2 2" width="28" height="28">
      <polygon fill="#ffcc00" points="0,-1 0.2245,-0.309 0.951,-0.309 0.363,0.118 0.588,0.809 0,0.382 -0.588,0.809 -0.363,0.118 -0.951,-0.309 -0.2245,-0.309"/>
    </symbol>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <!-- Corona de estrellas UE con el "3 €" tachado dentro -->
  <use href="#star" x="281.0" y="186.0"/><use href="#star" x="268.3" y="233.5"/><use href="#star" x="233.5" y="268.3"/><use href="#star" x="186.0" y="281.0"/><use href="#star" x="138.5" y="268.3"/><use href="#star" x="103.7" y="233.5"/><use href="#star" x="91.0" y="186.0"/><use href="#star" x="103.7" y="138.5"/><use href="#star" x="138.5" y="103.7"/><use href="#star" x="186.0" y="91.0"/><use href="#star" x="233.5" y="103.7"/><use href="#star" x="268.3" y="138.5"/>
  <text x="200" y="222" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#ffffff">3 €</text>
  <line x1="140" y1="250" x2="260" y2="160" stroke="#e63946" stroke-width="12" stroke-linecap="round"/>
  <!-- Texto -->
  <text x="360" y="170" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="104" fill="#ffffff" letter-spacing="2">Arance<tspan fill="#ffcc00">Less</tspan></text>
  <text x="364" y="228" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffcc00">¿3 € de arancel por artículo? No, gracias.</text>
  <text x="364" y="276" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#cfd8ff">Userscript que muestra solo el stock enviado desde la UE</text>
  <!-- Sellos de plataforma -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="364" y="306" width="150" height="44" rx="22" fill="#e62e04"/><text x="439" y="335" text-anchor="middle" fill="#fff">AliExpress</text>
    <rect x="530" y="306" width="110" height="44" rx="22" fill="#fb7701"/><text x="585" y="335" text-anchor="middle" fill="#fff">Temu</text>
    <rect x="656" y="306" width="250" height="44" rx="22" fill="none" stroke="#ffcc00" stroke-width="2"/><text x="781" y="335" text-anchor="middle" fill="#ffcc00">🇪🇺 0 € desde la UE</text>
  </g>
  <!-- Sello "ARANCEL" tachado, esquina -->
  <g transform="rotate(-12 1130 120)">
    <rect x="1030" y="80" width="200" height="80" rx="8" fill="none" stroke="#e63946" stroke-width="6"/>
    <text x="1130" y="135" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="40" fill="#e63946">ARANCEL</text>
    <line x1="1040" y1="150" x2="1220" y2="90" stroke="#e63946" stroke-width="6"/>
  </g>
</svg>
